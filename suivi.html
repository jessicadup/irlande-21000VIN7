<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Suivi des tâches — Irlande du Nord</title>
<link rel="stylesheet" href="css/style.css?v=13">
<style>.task-row input:disabled{cursor:not-allowed; opacity:0.55;}</style>
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <div class="brand"><span class="mark"></span> Irlande du Nord</div>
    <nav class="main-nav">
      <a href="index.html">Accueil</a>
      <a href="feuille-de-route.html">Feuille de route</a>
      <a href="logements.html">Logements</a>
      <a href="visites.html">Visites</a>
      <a href="administratif.html">Administratif</a>
      <a href="budget.html">Budget</a>
      <a href="suivi.html" class="active">Suivi</a>
    </nav>
  </div>
</header>
<div class="columns-divider"></div>

<main>
  <span class="page-kicker">Ne rien oublier</span>
  <h1 class="page-title" style="margin-bottom:32px;">Suivi des tâches</h1>

  <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
  <div id="progress-label" class="meta" style="color:var(--stone); margin-top:-24px; margin-bottom:24px; font-family:'JetBrains Mono',monospace; font-size:0.82rem;"></div>

  <div id="sync" style="color:var(--stone); font-family:'JetBrains Mono',monospace; font-size:0.78rem; margin:-16px 0 24px;"></div>

  <div id="task-list"></div>
</main>

<div class="columns-divider"></div>
<footer>Site privé — lien non référencé, à ne partager qu'en famille</footer>

<script>
const TASKS = [
  {id:"dates", title:"Cadrer les dates et la durée"},
  {id:"passeports", title:"Vérifier les passeports de toute la famille"},
  {id:"assurance", title:"Prendre une assurance voyage / santé"},
  {id:"eta", title:"Faire la demande ETA pour tout le monde"},
  {id:"argent", title:"Prévoir de la monnaie en livres sterling"},
  {id:"vols", title:"Réserver les vols Toulouse → Dublin"},
  {id:"itineraire", title:"Définir l'itinéraire géographique"},
  {id:"logements", title:"Rechercher et réserver les logements (Belfast + Dublin)"},
  {id:"voiture", title:"Réserver les 2 locations de voiture à Dublin"},
  {id:"parking", title:"Réserver le parking aéroport Toulouse"},
  {id:"visites", title:"Planifier les visites et excursions"},
  {id:"feuille", title:"Construire la feuille de route jour par jour"},
  {id:"budget", title:"Calculer le budget global et par foyer"},
  {id:"site", title:"Créer et structurer le site web"},
  {id:"ligne", title:"Mettre en ligne et partager le lien"},
  {id:"maj", title:"Tenir le site à jour"},
];

const STORAGE_KEY = "irlande_tasks_done";
function getLocal(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function setLocal(d){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }catch(e){}
}

let done = getLocal();   // cases cochées
let P = null;            // le module partage.js, une fois chargé
let mode = "local";      // "local" = cet appareil seulement | "partage" = base en ligne
let editeur = false;     // code familial saisi ?

function statut(msg){ document.getElementById("sync").textContent = msg; }

function render(){
  const verrou = (mode === "partage" && !editeur);
  const list = document.getElementById("task-list");
  list.innerHTML = "";
  TASKS.forEach(t => {
    const row = document.createElement("div");
    row.className = "task-row" + (done[t.id] ? " done" : "");
    row.innerHTML = `
      <input type="checkbox" id="chk-${t.id}" ${done[t.id] ? "checked" : ""} ${verrou ? "disabled" : ""}>
      <div>
        <div class="task-title">${t.title}</div>
      </div>
    `;
    row.querySelector("input").addEventListener("change", async e => {
      const cochee = e.target.checked;
      done[t.id] = cochee; setLocal(done); render();
      if (mode === "partage"){
        try{ await P.fusionner("suivi", {[t.id]: cochee}); }
        catch(err){
          done[t.id] = !cochee; setLocal(done); render();
          statut("Enregistrement impossible : réessaie dans un instant.");
        }
      }
    });
    list.appendChild(row);
  });

  const total = TASKS.length;
  const doneCount = TASKS.filter(t => done[t.id]).length;
  document.getElementById("progress-fill").style.width = (doneCount/total*100) + "%";
  document.getElementById("progress-label").textContent = `${doneCount} / ${total} étapes terminées`;
  if (verrou) statut("● Partagé avec la famille. Pour cocher, clique sur « Modifier » (en bas à droite) et entre le code familial.");
}

render();

// Connexion à la base en ligne (si elle n'est pas joignable, la page marche comme avant, sur cet appareil)
(async function demarrer(){
  try{
    P = await import("./partage.js?v=13");
    if (!(await P.connecter())) throw new Error("connexion impossible");
    editeur = P.estEditeur();
    P.installerBarre(ed => { editeur = ed; render(); });
    mode = "partage";
    statut("Connexion à la liste partagée…");
    render();
    P.ecouter("suivi", (data, deCache) => {
      if (data === null){
        // Liste partagée encore vide : on y met les cases déjà cochées sur cet appareil
        if (editeur && Object.values(done).some(Boolean)) P.fusionner("suivi", done).catch(() => {});
      } else {
        done = data; setLocal(done);
      }
      render();
      statut(deCache ? "○ Dernières données reçues (en attente de connexion)." : "● Synchronisé avec toute la famille.");
      if (mode === "partage" && !editeur) statut("● Partagé avec la famille. Pour cocher, clique sur « Modifier » (en bas à droite) et entre le code familial.");
    }, err => {
      mode = "local"; render();
      statut("Liste partagée indisponible (" + (err && err.code ? err.code : "erreur") + ") : les cases sont enregistrées sur cet appareil seulement.");
    });
  }catch(e){
    mode = "local"; render();
    statut("Hors ligne : les cases sont enregistrées sur cet appareil seulement.");
  }
})();
</script>
</body>
</html>
